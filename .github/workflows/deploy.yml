name: Validate public dashboard

on:
  push:
    branches: [main]
    # publish.sh pushes a pure-data commit every 15 minutes (public_snapshot.json only, confirmed via
    # `git add` in publish.sh) -- those don't need pytest/py_compile and were piling up faster than the
    # runner could finish them, cancelling each other and emailing a "failure" every ~15 min (found
    # 2026-10-05: 4 same-day runs, all `cancelled`, none an actual test failure). Code changes (incl. the
    # sanitizer/schema/app this workflow actually validates) still trigger normally.
    paths-ignore:
      - "public_snapshot.json"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate snapshot and run tests
        run: pytest -q

      - name: Compile Python files
        run: python -m py_compile streamlit_app.py sanitizer.py
